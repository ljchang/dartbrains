# Full dartbrains TOC for marimo-book.

title: DartBrains
description: An open-access introduction to functional neuroimaging analysis in Python
authors:
  - name: Luke Chang
    affiliation: Dartmouth College
copyright: >-
  &copy; Created by <a href="http://lukejchang.com">Luke J. Chang</a>.
  Supported in part by NSF CAREER #1848370 and NIMH R01MH116026.
license: CC-BY-SA-4.0
repo: https://github.com/ljchang/dartbrains
branch: master

logo: images/logo/dartbrains_logo_square_transparent.png
favicon: images/logo/favicon.ico
logo_placement: sidebar

theme:
  palette:
    primary: "#00693E"   # Dartmouth green
    accent:  "#A5D75F"
  font:
    text: Source Sans Pro
    code: JetBrains Mono

launch_buttons:
  molab: true
  github: true
  download: true

# Google Analytics — GA4 Measurement ID for dartbrains.org.
# (The legacy UA-138270939-1 Universal Analytics property was retired
# by Google on 2023-07-01; this is its GA4 successor.)
analytics:
  provider: google
  property: G-MQK18K92KD

# nltools has no stable release that installs under Pyodide: PyPI's latest
# stable (0.5.1) pulls dependencies with no browser wheels, and current master
# needs h5py>=3.15 while Pyodide ships 3.13. The 0.6 pre-release is the one
# that works -- it resolves against the scikit-learn 1.8 / h5py 3.13 that
# marimo's Pyodide (v314) bundles, installs in ~6 s and imports cleanly. This
# is what nltools.org's own browser docs pin, and it is what lets the chapters
# below offer an `edit` view. Drop this override once 0.6 ships as stable.
# The grader assignments are published on. TOC entries name their assignment
# by slug and the build fetches the notebook the grader currently publishes
# ({server}/a/{course}/{term}/{slug}/student.py) -- a republish in the grader
# reaches the site on the next build with nothing to commit here. sync-deps
# writes these three values into every chapter's PEP 723 block as
# [tool.grader], which is how a chapter opened in molab or on a laptop finds
# its assignments and its course storage. A new term is a one-line change.
grader:
  server: https://grader.dartbrains.org
  course: neuroimaging
  term: 2026-fall

dependencies:
  # molab installs a notebook's dependencies from its own PEP 723 block, and
  # `marimo-book sync-deps` writes those blocks into the chapters from these
  # settings. Re-run it after adding an import to a chapter.
  #
  # Assignments are published with requires-python >= 3.11; the chapters say
  # the same so the block never asks molab for a newer interpreter than it
  # has. dartbrains-tools gets a floor: 0.2.3 is the first release with the
  # storage layer the chapters use.
  requires_python: ">=3.11"
  extras:
    - dartbrains-tools>=0.2.6
  overrides:
    nltools: nltools==0.6.0.dev2

# marimo-book 0.1.27 added a 600s per-notebook execution cap
# (defaults.execution_timeout). Several chapters legitimately run longer at
# build time — Download_Data, Multivariate_Prediction, and RSA download
# datasets / do heavy compute (the full build has always taken ~75 min with
# no cap). `null` disables the cap, restoring the pre-0.1.27 behaviour.
# Downloads are network-bound with unpredictable timing, so a fixed cap risks
# spurious build failures; re-introduce a finite value here only if a genuinely
# hung notebook ever needs guarding.
defaults:
  execution_timeout: null
  # Keep the "*Written by ...*" byline each chapter carries under its title:
  # these chapters have distinct authors, and book.yml's `authors:` only names
  # the course's editors. (marimo-book hides the byline by default.)
  hide_author_line: false

# Static reactivity for discrete mo.ui widgets (slider/dropdown/etc).
# Each widget's downstream cells are re-rendered per value at build time
# and cached as a JSON lookup table; a tiny JS shim swaps the visible
# output as the reader moves the slider. No browser kernel needed.
#
# Heavy chapters (whole-brain decomposition + per-component nilearn
# rendering) trip the default caps and silently render static (no
# slider). Empirically:
#   - ICA: ~10 renders × ~15 s = ~150 s
#   - Connectivity: 9 threshold values × ~16 s ≈ 150 s (step 0.5; the PCA is
#     seeded so the per-value viewer volumes de-duplicate to one per component)
# Bump both wall-clock and bytes caps so these chapters can precompute.
precompute:
  enabled: true
  max_seconds_per_page: 1200        # 20 minutes
  max_bytes_per_page: 50000000      # 50 MB

# Per-widget-class default state — each anywidget's JS sees a sensible
# value when it calls model.get("key") on initial render in the static
# build (no kernel running to update state from cell-level kwargs).
widget_defaults:
  CompassWidget:
    b0: 3.0
  NetMagnetizationWidget:
    n_protons: 100
    b0_on: false
  PrecessionWidget:
    b0: 3.0
    flip_angle: 90.0
    t1: 0.0
    t2: 0.0
    show_relaxation: false
    paused: false
  SpinEnsembleWidget:
    sequence_type: spin_echo
    speed: 1.0
  KSpaceWidget:
    mask_type: full
    radius_fraction: 1.0
    speed: 1.0
  EncodingWidget:
    speed: 1.0
  ConvolutionWidget:
    pattern: block
    speed: 1.0
  TransformCubeWidget:
    tx: 0
    ty: 0
    tz: 0
    rot_x: 0
    rot_y: 0
    rot_z: 0
    scale_x: 1.0
    scale_y: 1.0
    scale_z: 1.0
  CostFunctionWidget:
    trans_x: 0
    trans_y: 0
  SmoothingWidget:
    fwhm: 0

toc:
  - file: content/intro.md

  - section: Course Overview
    children:
      - file: content/Instructors.md

  - section: Computing Resources
    children:
      - file: content/Setting_Up_Python.py
        title: Setting up Python
      - file: content/Download_Data.py
        # Downloads the full ~46 GB HuggingFace snapshot at execution time.
        # Render once locally (committed to _rendered/) so CI never downloads.
        mode: cached
      - file: content/assignments/how-to-submit.md
        title: Submitting assignments
        # The guide demonstrates itself: a zero-stakes practice assignment opens
        # in the drawer right where the page describes it, so a student can walk
        # sign-in / Check / Submit / Feedback before a real deadline rides on it.
        assignment: practice
      - file: content/Introduction_to_Programming.py
        # Pure-Python tutorial with ~10 mo.ui controls and no third-party imports,
        # so Pyodide boots fast and every example is editable in the browser.
        mode: wasm
        # Edit opens the chapter in marimo's editor in the page; the work is kept
        # in the reader's browser. The assignment opens in its own drawer.
        # No `run` view: this page is already reactive to read (mode: wasm), so
        # the only thing Edit adds — and the only one worth a second kernel — is
        # editing the code.
        views: [read, edit]
        assignment: programming
      - file: content/Introduction_to_Pandas.py
        # pandas/numpy are bundled with Pyodide and the salary CSV is 1.7 KB with
        # open CORS, so read_csv over the network works via pyodide_http's patch.
        mode: wasm
        views: [read, edit]
        assignment: pandas
      - file: content/Introduction_to_Polars.py
        # polars ships an emscripten wheel micropip can install, and the CSV is
        # the same 1.7 KB open-CORS file the pandas chapter reads.
        views: [read, edit]
        assignment: polars
      - file: content/Introduction_to_Plotting.py
        # matplotlib/seaborn are bundled with Pyodide; the CSV is 1.7 KB over open CORS.
        mode: wasm
        views: [read, edit]
        assignment: plotting
      - file: content/fmriprep_on_discovery.md
        title: Running fMRIPrep on HPC
      - file: content/Glossary.md

  - section: Neuroimaging Analysis
    children:
      - file: content/MR_Physics.py
        title: Introduction to Magnetic Resonance Imaging
        mode: wasm   # 33 widgets, joint-heavy → WASM gives full reactivity
        views: [read, run, edit]
      - file: content/ICA.py
        title: Separating Signal from Noise with ICA
        # static + precompute: 10 components, threshold fixed at 2.0 → 10 combos.
        # No edit view: marimo's WASM *editor* does not install from the
        # notebook's PEP 723 block. It prompts with "Missing packages" and
        # installs the bare name, which for nltools resolves to the latest
        # stable (0.5.1) — it needs numpy<1.24, has no Pyodide wheel, and the
        # install fails. Verified on the live site 2026-09-16. Restore
        # `views: [read, edit]` once the workbench can hand marimo the pinned
        # dependency list; the block itself is already correct.
      - file: content/Introduction_to_Neuroimaging_Data.py
        # No edit view — same nltools/PEP 723 reason as ICA above.
        # The assignment is unaffected: it opens in its own drawer and downloads
        # one subject's preprocessed run (57 MB), so it wants molab either way.
        assignment: neuroimaging-data
      - file: content/Signal_Processing.py
        title: Signal Processing Basics
        mode: wasm   # 14 sliders, mostly continuous → WASM gives full reactivity
        views: [read, edit]
        assignment: signal-processing
      - file: content/Preprocessing.py
        mode: wasm   # 12 widgets in joint group → WASM gives full reactivity
      - file: content/GLM.py
        title: Introduction to the General Linear Model
        views: [read, edit]
        assignment: glm
      - file: content/GLM_Single_Subject_Model.py
        title: Modeling Single Subject Data
        assignment: glm-single-subject
      - file: content/Group_Analysis.py
        assignment: group-analysis
      - file: content/Thresholding_Group_Analyses.py
        assignment: thresholding
      - file: content/Connectivity.py
      - file: content/Introduction_to_ICA.py
      - file: content/Multivariate_Prediction.py
        assignment: multivariate-prediction
      - file: content/Spatial_Feature_Selection.py
      - file: content/RSA.py
        title: Representational Similarity Analysis
      - file: content/Parcellations.py
        title: Introduction to Parcellations
        # Fetches many atlases over the network (AAL/Talairach from hosts whose
        # TLS chains certifi rejects, plus Harvard-Oxford/Destrieux/Yeo). Render
        # once locally (committed to _rendered/) so CI never hits the network.
        mode: cached
      - file: content/Resampling_Statistics.py
        # Simulation only — no data to fetch, and numpy/scipy/pandas/matplotlib/
        # seaborn/plotly all run in Pyodide, so the whole chapter is live.
        mode: wasm
        views: [read, edit]

  - section: Additional Courses
    children:
      - url: http://naturalistic-data.org/
        title: Naturalistic Data Analysis

  - section: Project Gallery
    children:
      - file: content/2019_Spring.md
      - file: content/2020_Spring.md
      - file: content/2020_Fall.md
      - file: content/2021_Fall.md
      - file: content/2022_Fall.md

  - section: Contributing
    children:
      - file: content/Contributing.md
      - url: https://github.com/ljchang/dartbrains
        title: GitHub Repository
