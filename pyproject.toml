[project]
name = "dartbrains"
version = "2.0.0"
description = "An open-access introduction to functional neuroimaging analysis in Python"
readme = "README.md"
requires-python = ">=3.13"
license = "CC-BY-SA-4.0"
authors = [
    { name = "Luke Chang", email = "luke.j.chang@dartmouth.edu" },
]
dependencies = [
    "anywidget>=0.9.21",
    # 0.1.5 lazy-imports the data subpackage so `import dartbrains_tools.*`
    # no longer drags in huggingface_hub (which imports termios, absent in
    # WASM) — required for the mode: wasm notebooks to boot in Pyodide.
    # 0.1.6 fixes anywidget layout/sizing (Convolution, NetMagnetization,
    # Precession) and makes the canvases responsive.
    # 0.1.7 points the sherlock/paranoia loaders at derivatives/fmriprep/
    # (the datasets were reorganized) — required or those loaders 404.
    "dartbrains-tools>=0.1.8",
    "datalad>=1.3.4",
    "datasets>=4.8.4",
    "huggingface-hub[hf-xet]>=1.8.0",
    # 0.23.6 ships marimo-team/marimo#9409 so MarimoIslandGenerator.from_file
    # propagates the notebook filename — lets notebooks resolve the repo root
    # via Path(__file__).resolve().parent.parent instead of a cwd/book.yml walk.
    # 0.24 moved the exporter to marimo._export and ships the islands micropip
    # payload marimo-book >= 0.1.31 relies on. Tracks the newest release.
    "marimo>=0.24.2",
    "matplotlib>=3.10.8",
    "nbformat",
    "nibabel>=5.4.2",
    # nilearn 0.13 tightened ZSlicer._sanitize_cut_coords to reject `range`, which
    # used to break every nltools plot() call. nltools 0.6 coerces range → list
    # before forwarding (nltools/data/braindata/plotting.py), so the <0.13 cap is
    # lifted. nltools 0.6 itself requires nilearn >= 0.12.
    "nilearn>=0.12",
    # Pinned to the exact pre-release the browser installs. book.yml's
    # dependencies.overrides sends WASM and workbench pages to
    # nltools==0.6.0.dev2, because git master needs h5py>=3.15 while Pyodide
    # ships 3.13. Building against a *different* 0.6 snapshot than readers run
    # would let an API change break an Edit session while the rendered page
    # still looks correct, with nothing in CI able to see it — so both sides
    # name the same version. Move both to "nltools>=0.6.0" once 0.6 is stable.
    # The 0.6 line removed nltools.stats (→ nltools.algorithms), the HRF module
    # (→ nilearn), predict(model=) (→ estimator=), radius_mm (→ radius),
    # compute_contrasts(statistic=) and Adjacency.similarity(project=); the
    # notebooks are migrated accordingly.
    #
    # The extras are NOT optional for this course:
    #   h5    — hdf5plugin for reading compressed HDF5 fit bundles. h5py itself
    #           became a core nltools dependency (cosanlab/nltools#469) because
    #           BrainCollection.fit() always writes HDF5.
    #   graph — Adjacency.to_graph() in the Connectivity chapter.
    # (interactive_plots / ipywidgets is no longer needed: since nltools
    # b3603484 iplot() is a self-contained anywidget with its own slider.)
    "nltools[h5,graph]==0.6.0.dev2",
    "numpy>=2.4.3",
    "pandas",
    "plotly>=6.6.0",
    "scikit-learn",
    "scipy>=1.17.1",
    "seaborn",
    "networkx",
    "polars>=1.39.3",
]

[project.optional-dependencies]
build = [
    # Assignment pages import marimo_grader_client (the student widget).
    # 0.1.1 announces a successful submission to the host page, which is what
    # records "Submitted" in the assignment drawer's version history.
    "marimo-grader-client>=0.1.1",
    "mograder>=0.3",
    "marimo-book",
]

[dependency-groups]
build = [
    # Assignment pages import marimo_grader_client (the student widget).
    # 0.1.1 announces a successful submission to the host page, which is what
    # records "Submitted" in the assignment drawer's version history.
    "marimo-grader-client>=0.1.1",
    "mograder>=0.3",
    # 0.1.18 stages PEP 723 copies as sibling files so __file__-relative
    # root detection works on WASM pages (marimo-book #46). 0.1.27 adds a
    # body-level build cache (TOC/launch-button edits no longer re-execute
    # notebooks), a build-free `marimo-book check` doctor, native [@key]
    # citations, and a strict cell-error gate that fails the build when a
    # cell raises instead of publishing the traceback. 0.1.28 hoists the
    # notebook title on WASM pages so MkDocs doesn't render it twice.
    # 0.1.31 supports marimo 0.24 (PyPI 0.1.30 capped it <0.24). 0.1.32 bakes
    # every anywidget's recorded model state — traits, binary buffers, CSS —
    # into static pages, so BrainData.iplot() (and any other anywidget)
    # renders interactively without a kernel instead of an empty mount.
    # 0.1.33 stops precompute from treating every anywidget cell as reactive
    # and de-duplicates gzip buffers by payload, which is what keeps the
    # Connectivity slider grid's viewer volumes down to one per component;
    # 0.1.34 finishes that by masking ipywidgets' IPY_MODEL_ references.
    # 0.1.35 compresses every inline figure to WebP, downscales oversized
    # renders, de-duplicates and serves them as lazy-loaded files — the
    # heaviest chapters shrink from tens of MB of inline PNG to a few hundred KB.
    # 0.1.36 keeps images inside nilearn view_img iframes at full resolution
    # (brainsprite slices its sprite by pixel geometry; 0.1.35 garbled them).
    # 0.1.37 rewraps anywidgets placed inside mo.vstack/hstack (they arrived as
    # escaped text) — the Connectivity and ICA component viewers.
    # 0.1.38 renders mo.md prose on mode: wasm pages (marimo ships it under
    # text/markdown with the rendered HTML as payload; 0.1.31–0.1.37 wrapped
    # it in <pre>, so MR_Physics / Signal_Processing / Preprocessing showed
    # escaped markup), keys the build cache on uv.lock so a dependency bump
    # re-renders unchanged notebooks, and labels precompute sliders.
    # 0.1.40 ships the in-browser workbench this book turns on with
    # `views: [read, run, edit]` (marimo's editor in the page, the reader's
    # copy kept in their browser) and the `assignment:` drawer that carries
    # the grader-published student notebooks; it also blocks the paragraphs of
    # a composite `mo.vstack` cell on static pages (the byline used to run into
    # the first paragraph) and honours `hide_author_line`, which this book
    # sets to false to keep each chapter's byline.
    "marimo-book>=0.1.40",
]

[tool.uv.sources]
# nltools was pinned to git master while 0.6 was unreleased. The 0.6
# pre-releases are on PyPI now, and the browser can only install from there, so
# the constraint above names the version directly and this source is gone —
# build and browser resolve the same wheel.
